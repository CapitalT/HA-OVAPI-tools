# Saving this YAML in the Home Assistant UI card editor will convert the yaml anchors to yaml. After re-opening this block can be removed to enable the GUI card editor.
entity: &entity
  entity: sensor.ovapi_vertrek_dam
dris_style: &dris_style
  color: '#ECEBB5'
  font-family: monospace
  line-height: 1em
  letter-spacing: 0.1em
#  outline: 1px solid red # Om layout te testen
  font-size: clamp(10px, 0.8vw, 22px)

keep_right: &keep_right
  transform: translateX(-100%)

keep_left: &keep_left
  transform: translateX(0%)
  width: 62%
  white-space: nowrap
  overflow: hidden

help:
  - "First save this full code in the Home Assistant yaml editor"
  - "reopen it"
  - "Remove this line and above"
#
# End of block to remove.

