rest:
  - resource: "http://v0.ovapi.nl/tpc/30005031,30005032,30005065/departures"
    # Zonder '/departures' worden ook aankomende ritten weergegeven die niet 
    # meer vertrekken.
    # Voor het vinden van de tpc's(Timing Point Code) gebruik:
    #  https://william-sy.github.io/ovapi-tpc-finder/site/
    # Meerdere tpc's toegestaan maar HA heeft wel een mag aan de hoeveelheid
    # data wat een attribuut aan kan.
    scan_interval: 60
    sensor:
      - name: "OVAPI Feed 30005031"
        unique_id: ovapi_feed_30005031
        json_attributes_path: $['30005031']
        json_attributes:
            - Stop
            - GeneralMessages
            - Passes
        value_template: >-
            {{ value_json['30005031'].Stop.TimingPointName }}
            
      - name: "OVAPI Feed 30005032"
        unique_id: ovapi_feed_30005032
        json_attributes_path: $['30005032']
        json_attributes:
            - Stop
            - GeneralMessages
            - Passes
        value_template: >-
            {{ value_json['30005032'].Stop.TimingPointName }}
            
      - name: "OVAPI Feed 30005065"
        unique_id: ovapi_feed_30005065
        json_attributes_path: $['30005065']
        json_attributes:
            - Stop
            - GeneralMessages
            - Passes
        value_template: >-
            {{ value_json['30005065'].Stop.TimingPointName }}


  # Een andere manier is om de API endpoint voor de stop area code te gebruiken. 
  # Niet elke halte heeft deze code. Hierna moet alsnog een sensor per tpc worden aangemaakt.
  - resource: "http://v0.ovapi.nl/stopareacode/09500/departures"
    scan_interval: 60
    sensor:
      - name: "OVAPI Feed 30009500"
        unique_id: ovapi_feed_30009500
        json_attributes_path: $['09500']['30009500']
        json_attributes:
            - Stop
            - GeneralMessages
            - Passes
        value_template: >-
            {{ value_json['09500']['30005031'].Stop.TimingPointName }}

      - name: "OVAPI Feed 30009501"
        unique_id: ovapi_feed_30009501
        json_attributes_path: $['09500']['30009501']
        json_attributes:
            - Stop
            - GeneralMessages
            - Passes
        value_template: >-
            {{ value_json['09500']['30009501'].Stop.TimingPointName }}



template:
  # Helper om de data van de REST feed te sorteren en filteren
  # *source_sensor* MOET de entity id zijn van de rest feed die je wilt gebruiken.
  # _Waarschijnlijk_ is het de name die hierboven is gebruikt bij de helper in 
  # kleine letters en met underscores.
  - use_blueprint:
      path: ovapi/data.yaml
      input:
        source_sensor: 
          - 'sensor.ovapi_feed_30005031'
    name: "OVAPI helper sensor 30005031"
    unique_id: ovapi_data_30005031
    
  - use_blueprint:
      path: ovapi/data.yaml
      input:
        source_sensor:
          - 'sensor.ovapi_feed_30005032'
    name: "OVAPI helper sensor 30005032"
    unique_id: ovapi_data_30005032
    
  - use_blueprint:
      path: ovapi/data.yaml
      input:
        source_sensor:
          - 'sensor.ovapi_feed_30005065'
    name: "OVAPI helper sensor 30005065"
    unique_id: ovapi_data_30005065

  # Metrostation CS
  - use_blueprint:
      path: ovapi/data.yaml
      input:
        source_sensor:
          - 'sensor.ovapi_feed_30009500'
          - 'sensor.ovapi_feed_30009501' # andere perron
    name: "OVAPI helper sensor 30009500"
    unique_id: ovapi_data_30009500
        
  # Blueprint template voor het weergeven van de volgende bus/tram/etc.
  # gebruikt de data van de helper
  # *source_sensor* MOET de entity id zijn van de OVAPI helper sensor hierboven.
  # Vaak is dat een afgeleide van de naam maar soms maakt HA er zelf iets van.
  # Controleer dit eerst als de onderstaande sensor niet werkt.
  - use_blueprint:
      path: ovapi/vertrek.yaml
      input:
        source_sensor: 'sensor.ovapi_helper_sensor_30005031'
    name: "OVAPI vertrek Damrak"
    unique_id: ovapi_vertrek_30005031
  - use_blueprint:
      path: ovapi/departures.yaml
      input:
        source_sensor: 'sensor.ovapi_helper_sensor_30005032'
    name: "OVAPI vertrek Damrak"
    unique_id: ovapi_vertrek_30005032
  
  - use_blueprint:
      path: ovapi/departures.yaml
      input:
        source_sensor: 'sensor.ovapi_helper_sensor_30005065'
    name: "OVAPI vertrek Nieuwezijdsvoorburgwal"
    unique_id: ovapi_vertrek_30005065


  - use_blueprint:
      path: ovapi/departures.yaml
      input:
        source_sensor: 'sensor.ovapi_helper_sensor_30009500'
    name: "OVAPI vertrek 30009500"
    unique_id: ovapi_vertrek_30009500


