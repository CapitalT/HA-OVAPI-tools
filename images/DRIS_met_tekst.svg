<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 420"
     preserveAspectRatio="none">

  <defs>
    <!-- LED dots -->
    <pattern id="ledDots" width="10" height="10" patternUnits="userSpaceOnUse"
         patternTransform="translate(2 2)">
      <circle cx="2.5" cy="2.5" r="1.8"
              fill="#f2b22a" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- buitenrand -->
  <rect x="0" y="0" width="1200" height="420" fill="#3a3f44"/>

  <!-- binnenvlak -->
  <rect x="2" y="2" rx="2" ry="2" width="1196" height="416" fill="#000"/>

  <!-- header teksten -->
  <g font-family="Roboto, sans-serif"
     font-size="42"
     fill="#ffffff"
     dominant-baseline="middle">
    <text x="70"  y="106">Lijn</text>
    <text x="210" y="106">Richting</text>
    <text x="1130" y="106" text-anchor="end">Vertrek</text>
  </g>

  <!-- matrix -->
  <rect x="40" y="140" width="1120" height="240"
        rx="18" ry="18"
        fill="#040506"/>

  <!-- LED overlay -->
  <rect x="40" y="140" width="1120" height="240"
        rx="20" ry="20"
        fill="url(#ledDots)" opacity="0.85"/>

</svg>

